gin:0 0 20px}.section h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:7px}.reasons{display:grid;gap:9px}.reason{background:#f7f3eb;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;line-height:1.5;font-size:14px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meta div{background:#f7f3eb;border-radius:12px;padding:11px}.meta b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.meta span{font-size:14px;line-height:1.45}.advice{background:#eef5f0;border:1px solid #d4e4da;border-radius:14px;padding:13px 14px;line-height:1.6;font-size:14px}.alternatives{display:flex;flex-wrap:wrap;gap:8px}.alt{border:1px solid #a8c0b2;color:var(--green);background:#f4faf6;border-radius:99px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ghost,.solid{height:44px;border-radius:12px;font-weight:700;font-size:14px}.ghost{border:1px solid #cfc5b5;background:white;color:var(--ink)}.solid{border:0;background:var(--green);color:white}.legend h2{font-size:20px;margin:0 0 5px}.legend>p{color:var(--muted);font-size:13px;margin:0 0 14px}.legend-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.legend-item{padding:12px;border:0;border-radius:13px;color:white;min-height:83px;text-align:left;cursor:pointer;font:inherit;width:100%}.legend-item:focus-visible{outline:3px solid #26332d;outline-offset:2px}.legend-item b{display:block;margin-bottom:5px}.legend-item span{font-size:12px;opacity:.9;line-height:1.4}.feedback{text-align:center;color:var(--muted);font-size:12px;padding:2px 28px 18px;line-height:1.6}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#1e2d27;color:white;padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}.toast.show{opacity:1}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(520px,100%);height:68px;background:rgba(255,253,248,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav{border:0;background:none;color:#7b817e;font-size:12px}.nav b{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--green);font-weight:700}.empty{text-align:center;padding:28px 14px}.empty .icon{font-size:38px}.empty h3{margin:10px 0 6px}.empty p{color:var(--muted);line-height:1.6;font-size:14px}sup{font-size:9px}

.about-page{padding:4px 2px}.about-hero{background:linear-gradient(135deg,#315d4d,#56806d);color:#fff;border-radius:17px;padding:20px;margin-bottom:14px}.about-hero h2{margin:0 0 8px;font-size:22px}.about-hero p{margin:0;line-height:1.7;font-size:14px;color:#edf5f1}.about-block{border-top:1px solid var(--line);padding:17px 2px 3px}.about-block:first-of-type{border-top:0}.about-block h3{margin:0 0 9px;font-size:16px}.about-block p{margin:0;color:#58645e;line-height:1.75;font-size:14px}.developer-card{display:flex;gap:12px;align-items:flex-start;background:#f3f7f4;border-radius:14px;padding:14px}.developer-logo{width:42px;height:42px;flex:0 0 42px;background:var(--green);color:#fff;border-radius:10px;display:grid;place-items:center;font-weight:800}.qr-wrap{text-align:center;background:#f7f3eb;border-radius:16px;padding:18px;margin-top:10px}.qr-box{width:154px;height:154px;margin:0 auto 12px;background:#fff;border:8px solid #fff;box-shadow:0 2px 12px rgba(0,0,0,.08);display:grid;place-items:center}.qr-placeholder{width:126px;height:126px;background:repeating-conic-gradient(#26332d 0 25%,#fff 0 50%) 0/18px 18px;position:relative}.qr-placeholder:after{content:'链接待配置';position:absolute;inset:36px 13px;background:#fff;display:grid;place-items:center;color:#26332d;font-size:12px;font-weight:700;border:3px solid #26332d}.qr-note{font-size:12px!important;color:#7a817d!important}.back-home{width:100%;height:46px;border:0;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:15px;margin-top:16px}

.view-mode .hero,.view-mode .panel:first-of-type{display:none}.alt-directory{padding:4px 2px}.alt-directory h2{font-size:23px;margin:2px 0 6px}.alt-directory .lead{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 16px}.alt-list{display:grid;gap:10px}.alt-row{width:100%;border:1px solid #d7e2da;background:#f4faf6;color:var(--green);border-radius:14px;padding:15px 16px;text-align:left;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}.alt-row span{font-size:18px}.internal-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}.internal-back{border:0;background:#eef3ef;color:var(--green);border-radius:99px;width:38px;height:38px;font-size:20px}.internal-title{font-size:13px;color:var(--muted)}

<body>
<div class="app">
<header class="hero"><div class="brand"><div class="mark">木</div><span>红木及其他名贵热带硬木消费指南</span></div><h1>买木材前，查一查</h1><p>输入树种中文名、俗名、商品名或拉丁名，快速了解消费级别、风险原因与替代选择。</p></header>
<section class="panel"><div class="search-label">你想查询哪种木材？</div><div class="search"><input id="q" autocomplete="off" placeholder="例如：巴西黑黄檀、大红酸枝"/><button id="go">查询</button></div><div class="chips"><button class="chip" data-q="巴西黑黄檀">巴西黑黄檀</button><button class="chip" data-q="小叶紫檀">小叶紫檀</button><button class="chip" data-q="大红酸枝">大红酸枝</button><button class="chip" data-q="柚木">柚木</button></div><div class="intro">原型提示：当前已录入一组代表性树种，用于测试查询、风险反馈和替代推荐交互。</div></section>
<section id="welcome" class="panel legend"><h2>四级消费指引</h2><p>颜色越暖，表示消费与合规风险越高。</p><div class="legend-grid"><button class="legend-item" data-level="不可消费" style="background:#9f3e36"><b>不可消费</b><span>任何情况下都不买</span></button><button class="legend-item" data-level="减少消费" style="background:#c96d2d"><b>减少消费</b><span>尽量不买，购买前核验证明</span></button><button class="legend-item" data-level="适度消费" style="background:#a77713"><b>适度消费</b><span>少买，关注来源与可持续性</span></button><button class="legend-item" data-level="替代选择" style="background:#4f7f62"><b>替代选择</b><span>优先考虑风险较低的替代材</span></button></div></section>
<section id="result" class="panel result hidden"></section>
<section id="empty" class="panel empty hidden"><div class="icon">🔎</div><h3>暂未找到这个名称</h3><p>请尝试输入树种正式中文名、常见俗名或商品名。原型数据库仍在整理中。</p></section>
<div class="feedback">本工具提供消费风险参考，不替代专业木材鉴定或进出口合规审查。保护等级与贸易管理可能更新，请以正式发布版本为准。</div>
</div>
<div class="toast" id="toast">已复制查询摘要</div>
<nav class="bottom"><button class="nav active" id="home"><b>⌕</b>查树种</button><button class="nav" id="browse"><b>♧</b>替代推荐</button><button class="nav" id="about"><b>ⓘ</b>关于指南</button></nav>
<script>
const data=[
{name:'巴西黑黄檀',aliases:['Brazilian rosewood','Dalbergia nigra'],latin:'Dalbergia nigra',level:'不可消费',color:'red',type:'国标红木',reasons:['CITES公约附录Ⅰ管制','IUCN红色名录易危（VU）','现存数量少，野生资源承受较高压力'],origin:'巴西',uses:'高档家具、工艺品',advice:'任何情况下都不建议购买。若商家以其他名称销售，应进一步核实学名和合法来源。',alts:['虎斑楝','赛鞋木豆','圆盘豆']},
{name:'檀香紫檀',aliases:['小叶紫檀','Red sanders','Red Sandalwood'],latin:'Pterocarpus santalinus',level:'减少消费',color:'orange',type:'国标红木',reasons:['CITES公约附录Ⅱ管制','IUCN红色名录濒危（EN）','存在非法采伐风险'],origin:'印度',uses:'家具、乐器、雕刻工艺品',advice:'尽量不买。购买前核验出口、再出口及进口相关证明，确认名称、产地与证件一致。',alts:['虎斑楝','赛鞋木豆','圆盘豆']},
{name:'交趾黄檀',aliases:['大红酸枝','Siamese rosewood'],latin:'Dalbergia cochinchinensis',level:'减少消费',color:'orange',type:'国标红木',reasons:['CITES公约附录Ⅱ管制','IUCN红色名录极危（CR）','过度采伐与栖息地退化'],origin:'越南、老挝、柬埔寨、泰国',uses:'高档家具、工艺品',advice:'尽量不买。购买前应要求商家提供完整、可核验的合法来源证明。',alts:['虎斑楝','赛鞋木豆','圆盘豆']},
{name:'大果紫檀',aliases:['缅甸花梨','草花梨','Burma padauk'],latin:'Pterocarpus macrocarpus',level:'减少消费',color:'orange',type:'国标红木',reasons:['IUCN红色名录濒危（EN）','存在过度采伐压力'],origin:'泰国、缅甸、老挝、柬埔寨、越南',uses:'家具、装饰',advice:'尽量减少购买，并重点核实树种学名、产地及合法来源。',alts:['虎斑楝','赛鞋木豆','圆盘豆']},
{name:'厚瓣乌木',aliases:['African ebony','乌木','黑檀'],latin:'Diospyros crassiflora',level:'适度消费',color:'yellow',type:'国标红木',reasons:['IUCN红色名录易危（VU）','栖息地减少','毁林及过度采伐'],origin:'中非和西非',uses:'家具、工艺品',advice:'少买，优先选择来源清楚、能够提供合法证明的产品。',alts:['虎斑楝','赛鞋木豆','圆盘豆']},
{name:'安哥拉紫檀',aliases:['安哥拉花梨木','Umbila','Pterocarpus angolensis'],latin:'Pterocarpus angolensis',level:'减少消费',color:'orange',type:'其他名贵树种',reasons:['已知受CITES贸易管理','IUCN红色名录无危（LC）','部分地区成熟大径木减少，自然更新受到影响'],origin:'安哥拉、津巴布韦、坦桑尼亚',uses:'家具、地板、装饰单板、雕刻',advice:'尽量减少购买。若购买，应核实具体CITES适用范围及合法来源文件。',alts:['虎斑楝','赛鞋木豆','圆盘豆']},
{name:'柚木',aliases:['Teak','紫柚木'],latin:'Tectona grandis',level:'减少消费',color:'orange',type:'其他名贵树种',reasons:['IUCN红色名录濒危（EN）','资源数量下降','存在过度开发压力'],origin:'缅甸、泰国、印度尼西亚',uses:'造船、建筑、车辆、家具',advice:'尽量减少购买，特别关注天然来源、产地和合法性证明。',alts:['印茄木','虎斑楝','圆盘豆']},
{name:'虎斑楝',aliases:['核桃木','Dibetou','Lovoa trichilioides'],latin:'Lovoa trichilioides',level:'其他可替代名贵树种',color:'green',type:'替代材',reasons:['可作为部分名贵热带硬木的替代选择','仍应关注采伐及来源信息'],origin:'非洲多国',uses:'家具、橱柜、工艺品',advice:'可优先考虑，但仍建议选择来源透明、可追溯的产品。',alts:['赛鞋木豆','圆盘豆','印茄木']},
{name:'赛鞋木豆',aliases:['小斑马','Awoura zingana','Julbernardia pellegriniana'],latin:'Julbernardia pellegriniana',level:'其他可替代名贵树种',color:'green',type:'替代材',reasons:['可作为部分红木的替代选择','仍存在采伐压力，需关注来源'],origin:'喀麦隆、加蓬及赤道非洲',uses:'家具、装饰',advice:'可优先考虑，同时选择来源透明、可追溯的产品。',alts:['虎斑楝','圆盘豆','印茄木']},
{name:'圆盘豆',aliases:['奥坎','Okan','Cylicodiscus gabunensis'],latin:'Cylicodiscus gabunensis',level:'其他可替代名贵树种',color:'green',type:'替代材',reasons:['现存数量相对较多','存在自然更新和过度采伐问题'],origin:'中非和西非多国',uses:'家具、地板',advice:'可优先考虑，但仍需关注木材来源及采伐合法性。',alts:['虎斑楝','赛鞋木豆','印茄木']},
{name:'印茄木',aliases:['波罗格','Merbau','Intsia bijuga'],latin:'Intsia bijuga',level:'其他可替代名贵树种',color:'green',type:'替代材',reasons:['可作为部分名贵热带硬木替代选择','资源面临持续利用压力'],origin:'印度尼西亚、巴布亚新几内亚',uses:'地板、细木工、桥梁、码头',advice:'可作为替代选择，但仍应核实具体来源，避免购买来源不明产品。',alts:['虎斑楝','赛鞋木豆','圆盘豆']}
];
const q=document.getElementById('q'), result=document.getElementById('result'), welcome=document.getElementById('welcome'), empty=document.getElementById('empty');
function findSpecies(term){term=term.trim().toLowerCase();return data.find(x=>[x.name,x.latin,...x.aliases].some(v=>v.toLowerCase().includes(term)||term.includes(v.toLowerCase())))}
function render(x){welcome.classList.add('hidden');empty.classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<div class="risk-head ${x.color}"><div class="eyebrow">查询结果 · ${x.type}</div><div class="species-title">${x.name}</div><div class="latin">${x.latin}</div><div class="level-row"><div><div class="eyebrow">消费建议</div><div class="level">${x.level}</div></div><div class="tag">2026 初稿数据</div></div></div><div class="body"><div class="section"><h3>⚠ 为什么这样建议</h3><div class="reasons">${x.reasons.map(r=>`<div class="reason">${r}</div>`).join('')}</div></div><div class="section"><h3>🌏 基本信息</h3><div class="meta"><div><b>主要产地</b><span>${x.origin}</span></div><div><b>常见用途</b><span>${x.uses}</span></div></div></div><div class="section"><h3>✓ 消费行动建议</h3><div class="advice">${x.advice}</div></div><div class="section"><h3>♻ 可考虑的替代选择</h3><div class="alternatives">${x.alts.map(a=>`<button class="alt" data-alt="${a}">${a}</button>`).join('')}</div></div><div class="actions"><button class="ghost" id="again">重新查询</button><button class="solid" id="copy">复制查询摘要</button></div></div>`; result.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{q.value=b.dataset.alt;search()});document.getElementById('again').onclick=()=>{goHome();setTimeout(()=>q.focus(),350)};document.getElementById('copy').onclick=()=>copySummary(x)}
function search(){const term=q.value.trim();if(!term)return;const x=findSpecies(term);if(x)render(x);else{welcome.classList.add('hidden');result.classList.add('hidden');empty.classList.remove('hidden');empty.scrollIntoView({behavior:'smooth'})}}
function copySummary(x){const text=`${x.name}｜${x.level}\n原因：${x.reasons.join('；')}\n建议：${x.advice}\n替代选择：${x.alts.join('、')}`;navigator.clipboard?.writeText(text);const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
document.getElementById('go').onclick=search;q.addEventListener('keydown',e=>{if(e.key==='Enter')search()});document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q.value=b.dataset.q;search()});document.getElementById('home').onclick=goHome;
function showLevel(level){document.body.classList.add('view-mode');q.value='';welcome.classList.add('hidden');empty.classList.add('hidden');result.classList.remove('hidden');const labels={不可消费:'不可消费',减少消费:'减少消费',适度消费:'适度消费',替代选择:'替代选择'};const choices=level==='替代选择'?data.filter(x=>x.type==='替代材'):data.filter(x=>x.level===level);result.innerHTML=`<div class="body alt-directory"><div class="internal-top"><button class="internal-back" id="levelBack">‹</button><div class="internal-title">红木消费风险查询助手</div></div><h2>${labels[level]}</h2><p class="lead">以下为该级别已录入的树种。点击树种名称查看详细信息。</p><div class="alt-list">${choices.map(x=>`<button class="alt-row" data-choice="${x.name}">${x.name}<span>›</span></button>`).join('')}</div></div>`;window.scrollTo({top:0,behavior:'smooth'});document.getElementById('levelBack').onclick=goHome;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{document.body.classList.remove('view-mode');q.value=b.dataset.choice;search()})}document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>showLevel(b.dataset.level));document.getElementById('browse').onclick=()=>showLevel('替代选择');document.getElementById('about').onclick=()=>{document.body.classList.add('view-mode');q.value='';welcome.classList.add('hidden');empty.classList.add('hidden');result.classList.remove('hidden');result.innerHTML=`<div class="body about-page"><div class="about-hero"><h2>指南简介</h2><p>《红木及其他名贵热带硬木消费指南》面向以使用或收藏为目的购买红木及其他名贵木材及其制品的消费者，帮助快速查询消费建议、保护与贸易管理信息，并了解风险较低的替代选择。指南综合资源现状与管制条件，将树种分为不可消费、减少消费、适度消费和其他可替代名贵树种，为购买决策提供简明参考。</p></div><div class="about-block"><h3>开发方简介</h3><div class="developer-card"><div class="developer-logo">T</div><p><b>TRAFFIC</b><br>国际野生物贸易研究组织（TRAFFIC）是一个在全球范围内关注野生动植物贸易、保护生物多样性和可持续发展的非政府组织。</p></div></div><div class="about-block"><h3>下载完整版消费指南</h3><div class="qr-wrap"><div class="qr-box"><div class="qr-placeholder"></div></div><p>扫码下载完整版消费指南</p><p class="qr-note">当前为原型占位二维码。终版指南发布后，可替换为实际下载二维码。</p></div></div><button class="back-home" id="backHome">返回首页</button></div>`;window.scrollTo({top:0,behavior:'smooth'});document.getElementById('backHome').onclick=goHome};
function goHome(){document.body.classList.remove('view-mode');q.value='';result.classList.add('hidden');empty.classList.add('hidden');welcome.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
</script>
</body></html>
